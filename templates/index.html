<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadient AI - Intelligent Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #60a5fa;
            --primary-dark: #1e40af;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
            --chat-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bot-bubble: #f1f5f9;
            --user-bubble: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            --user-text: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: url('/static/bg.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.85); /* Slightly more transparent */
            backdrop-filter: blur(15px); /* Increased blur */
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 20px;
            transition: all 0.3s ease;
        }

        header {
            padding: 24px 30px;
            background: #fff;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-placeholder {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        #chat-window::-webkit-scrollbar {
            width: 6px;
        }

        #chat-window::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 80%;
        }

        .bot-wrapper {
            align-self: flex-start;
        }

        .user-wrapper {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: slideIn 0.3s ease-out;
            position: relative;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-message {
            background-color: var(--bot-bubble);
            color: var(--text-main);
            border-top-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .user-message {
            background: var(--user-bubble);
            color: var(--user-text);
            border-top-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }

        /* Markdown Styling enhancement */
        .bot-message h1, .bot-message h2, .bot-message h3 { margin: 15px 0 10px 0; font-weight: 600; }
        .bot-message p { margin-bottom: 10px; }
        .bot-message p:last-child { margin-bottom: 0; }
        .bot-message ul, .bot-message ol { margin-left: 20px; margin-bottom: 10px; }
        .bot-message pre {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bot-message code {
            font-family: 'Fira Code', 'Courier New', monospace;
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--primary-dark);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .bot-message pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
            border-radius: 0;
            font-size: 0.85rem;
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0 5px;
        }

        #input-area-container {
            padding: 20px 30px 30px;
            background: #fff;
        }

        #input-area {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px 15px;
            border-radius: 16px;
            gap: 12px;
            transition: all 0.2s;
        }

        #input-area:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background: #fff;
        }

        input {
            flex: 1;
            padding: 10px 5px;
            border: none;
            background: transparent;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .action-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }

        /* Typing Indicator */
        .typing-bubble {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            background: var(--bot-bubble);
            border-radius: 20px;
            border-top-left-radius: 4px;
            width: fit-content;
            animation: slideIn 0.3s ease-out;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: wave 1.3s linear infinite;
        }

        .dot:nth-child(2) { animation-delay: -1.1s; }
        .dot:nth-child(3) { animation-delay: -0.9s; }

        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* Responsive Improvements */
        @media (max-width: 640px) {
            #chat-container {
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }
            body { padding: 0; }
        }
    </style>
</head>
<body>

<div id="chat-container">
    <header>
        <div class="header-info">
            <div class="logo-placeholder">
                <i data-lucide="bot"></i>
            </div>
            <div>
                <h1>Cadient Assistant</h1>
                <div class="status">Always online</div>
            </div>
        </div>
        <div class="header-actions">
            <!-- Add future actions here like Clear Chat or Settings -->
            <button id="clear-chat" title="Clear Chat" style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 5px;">
                <i data-lucide="trash-2" size="20"></i>
            </button>
        </div>
    </header>
    
    <div id="chat-window">
        <!-- Initial Message -->
        <div class="message-wrapper bot-wrapper">
            <div class="message bot-message">
                Hello! I'm your Cadient Assistant. How can I help you today?
            </div>
            <div class="timestamp">Just now</div>
        </div>
    </div>

    <div id="input-area-container">
        <div id="input-area">
            <i data-lucide="message-square" style="color: var(--text-muted);"></i>
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button id="send-btn" class="action-btn">
                <i data-lucide="send"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-chat');
    
    // Generate a session ID
    const sessionId = Math.random().toString(36).substring(7);

    // Initialize Lucide icons
    lucide.createIcons();

    // Configure marked
    marked.setOptions({
        breaks: true,
        gfm: true
    });

    function getTimestamp() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(text, isUser) {
        const wrapper = document.createElement('div');
        wrapper.className = isUser ? 'message-wrapper user-wrapper' : 'message-wrapper bot-wrapper';
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
        
        if (isUser) {
            msgDiv.innerText = text;
        } else {
            msgDiv.innerHTML = marked.parse(text);
        }
        
        const timestamp = document.createElement('div');
        timestamp.className = 'timestamp';
        timestamp.innerText = getTimestamp();
        
        wrapper.appendChild(msgDiv);
        wrapper.appendChild(timestamp);
        
        chatWindow.appendChild(wrapper);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        
        return wrapper;
    }

    function showTypingIndicator() {
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper bot-wrapper typing-container';
        
        const bubble = document.createElement('div');
        bubble.className = 'typing-bubble';
        bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        
        wrapper.appendChild(bubble);
        chatWindow.appendChild(wrapper);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return wrapper;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        addMessage(message, true);
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        const typingIndicator = showTypingIndicator();

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, session_id: sessionId })
            });
            const data = await response.json();
            
            chatWindow.removeChild(typingIndicator);
            
            let fullMsg = data.message;
            if (data.product_list && data.product_list.length > 0) {
                fullMsg += "\n\n**Suggested Features:** " + data.product_list.join(", ");
            }
            addMessage(fullMsg, false);
        } catch (error) {
            if (chatWindow.contains(typingIndicator)) {
                chatWindow.removeChild(typingIndicator);
            }
            addMessage("I'm sorry, I encountered an issue connecting to the server.", false);
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    clearBtn.addEventListener('click', async () => {
        if (confirm('Are you sure you want to clear the chat?')) {
            try {
                await fetch('/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                chatWindow.innerHTML = '';
                addMessage("Hello! I'm your Cadient Assistant. How can I help you today?", false);
            } catch (error) {
                console.error('Failed to clear session:', error);
            }
        }
    });

    // Handle focus state for input
    userInput.addEventListener('focus', () => {
        // Scroll to bottom on mobile when keyboard opens
        setTimeout(() => {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }, 300);
    });
</script>

</body>
</html>
